<svg xmlns="http://www.w3.org/2000/svg" width="76" height="24" viewBox="0 0 76 24" role="img" aria-label="Status: Active">
  <title>Status: Active</title>
  <defs>
    <!-- Subtle glow filter for the green dot -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#22C55E" flood-opacity="0.75"/>
    </filter>
  </defs>
  <!-- 7px diameter circular green dot (#22C55E) with subtle glow (radius 3.5, centered at y=12) -->
  <circle cx="8.5" cy="12" r="3.5" fill="#22C55E" filter="url(#glow)"/>
  <!-- 7px gap: dot right edge is at 12px, text starts at x=19px -->
  <!-- 12px font, font-weight 600, soft mint-green (#86EFAC) -->
  <text x="19" y="16" fill="#86EFAC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Active</text>
</svg>