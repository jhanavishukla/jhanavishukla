<svg xmlns="http://www.w3.org/2000/svg" width="92" height="26" viewBox="0 0 92 26" role="img" aria-label="Status: Active">
  <title>Status: Active</title>
  <!-- Background status pill with subtle dark teal/cyan background & border -->
  <rect width="92" height="26" rx="5" fill="#082b35" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Glowing pulse indicator dot -->
  <circle cx="16" cy="13" r="3.5" fill="#00E5FF"/>
  <!-- Status text: 12.5px semibold, bright readable cyan -->
  <text x="26" y="17" fill="#00E5FF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.4">Active</text>
</svg>