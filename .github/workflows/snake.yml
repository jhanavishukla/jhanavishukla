name: Generate Snake Animation

on:
  # Run automatically every day at midnight (UTC)
  schedule:
    - cron: "0 0 * * *"

  # Allows manual execution at any time from the Actions tab
  workflow_dispatch:

  # Run on push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generates snake animation SVGs for both light and dark themes
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jhanavishukla
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fetch total contributions and generate high-contrast cyan badge
      - name: Generate total contributions badge
        run: |
          QUERY='query { user(login: "jhanavishukla") { contributionsCollection { contributionCalendar { totalContributions } } } }'
          TOTAL=$(gh api graphql -f query="$QUERY" --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          echo "Total contributions: $TOTAL"
          cat <<EOF > dist/contributions.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="360" height="42" viewBox="0 0 360 42" role="img" aria-label="Total Contributions: ${TOTAL}">
            <title>Total Contributions: ${TOTAL}</title>
            <defs>
              <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#00E5FF"/>
                <stop offset="100%" stop-color="#00B4D8"/>
              </linearGradient>
            </defs>
            <rect width="360" height="42" rx="8" fill="#0b0f19" stroke="#1f293d" stroke-width="1.5"/>
            <g fill="#00E5FF" transform="translate(18, 12)">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M9 0C4.03 0 0 4.03 0 9c0 3.98 2.58 7.35 6.16 8.54.45.08.62-.2.62-.43v-1.52c-2.5.54-3.03-1.21-3.03-1.21-.41-1.04-1-1.32-1-1.32-.82-.56.06-.55.06-.55.9.06 1.38.93 1.38.93.8 1.37 2.1 0.98 2.62.75.08-.58.32-.98.57-1.21-2-.23-4.1-1-4.1-4.45 0-.98.35-1.78.93-2.41-.09-.23-.4-1.14.09-2.38 0 0 .76-.24 2.47.92.72-.2 1.48-.3 2.24-.3.76 0 1.52.1 2.24.3 1.71-1.16 2.47-.92 2.47-.92.49 1.24.18 2.15.09 2.38.58.63.93 1.43.93 2.41 0 3.46-2.11 4.22-4.12 4.44.33.28.62.83.62 1.68v2.49c0 .24.16.52.62.43C15.42 16.35 18 12.98 18 9c0-4.97-4.03-9-9-9z"/>
            </g>
            <text x="44" y="26" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">TOTAL CONTRIBUTIONS</text>
            <rect x="254" y="7" width="90" height="28" rx="6" fill="url(#cyanPill)"/>
            <text x="299" y="26" fill="#0b0f19" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">${TOTAL}</text>
          </svg>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deploys generated SVGs to the 'output' branch
      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
