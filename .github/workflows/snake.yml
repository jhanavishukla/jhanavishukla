name: Generate Snake Animation

on:
  # Run automatically every day at midnight (UTC)
  schedule:
    - cron: "0 0 * * *"

  # Allows manual execution at any time from the Actions tab
  workflow_dispatch:

  # Run on push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generates snake animation SVGs for both light and dark themes
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jhanavishukla
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fetch total contributions and generate badge
      - name: Generate total contributions badge
        run: |
          QUERY='query { user(login: "jhanavishukla") { contributionsCollection { contributionCalendar { totalContributions } } } }'
          TOTAL=$(gh api graphql -f query="$QUERY" --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          echo "Total contributions: $TOTAL"
          curl -s "https://img.shields.io/badge/Total%20Contributions-${TOTAL}-00F0FF?style=for-the-badge&logo=github&logoColor=white&labelColor=0b0f19" -o dist/contributions.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deploys generated SVGs to the 'output' branch
      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
